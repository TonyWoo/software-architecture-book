# 构建 Nimbus 文档站并部署到 GitHub Pages
#
# push 到 main 时触发：装配中文 C# 版手稿，从双版本手稿重新导入
# （book/ 中文 C# 版 + book-java/ 中文 Java 版），
# 构建 Nimbus 静态站，部署到 https://tonywoo.github.io/software-architecture-book/
# 注意：仓库必须保持公开，改回私有后 Pages 会下线（免费账号限制）。

name: nimbus-site

on:
  push:
    branches: [main]
    paths:
      - 'content/**'
      - 'code/**'
      - 'tools/**'
      - 'manuscript/**'
      - 'images/**'
      - 'book.yaml'
      - 'export_manuscript.py'
      - 'site/**'
      - '.github/workflows/nimbus.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # astro 7 + nimbus-docs 要求 Node >= 22.12
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - run: npm ci
        working-directory: site

      # 先装配中文 C# 版手稿（manuscript/ 是提交物，这里重跑一次保证新鲜），
      # prebuild 会自动导入双版本（book/ + book-java/）
      - run: python3 tools/assemble.py --lang zh --stack csharp

      - run: npm run build
        working-directory: site

      - name: 检查页面数（每版 82：前言 1 + 10 章 × 8 + 落地页 1）
        run: |
          n1=$(find src/content/docs/book -name '*.md' | wc -l)
          n2=$(find src/content/docs/book-java -name '*.md' | wc -l)
          echo "book pages: $n1, book-java pages: $n2"
          test "$n1" -eq 82 && test "$n2" -eq 82
        working-directory: site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
